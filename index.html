<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleiv</title>
  <meta name="description" content="Sleiv – ukemeny og middagsplan for iPhone.">
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1f2328;
      --muted: #5c6370;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b;
        --fg: #e8e6e1;
        --muted: #a0a6ae;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 4rem 1rem;
    }
    h1 { font-size: 2.5rem; line-height: 1.1; margin: 0 0 .5rem; }
    h2 { font-size: 1.15rem; margin: 2.5rem 0 .5rem; }
    p { margin: 0 0 1rem; }
    .lead { font-size: 1.2rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Sleiv</h1>
  <p class="lead">Ukemeny og middagsplan for iPhone.</p>

  <p>Legg inn middagene du lager ofte, planlegg uken og se dagens middag i en
  widget. Alt lagres på telefonen din.</p>

  <h2>Kontakt og hjelp</h2>
  <p>Spørsmål, feil eller ønsker? Send en e-post til
  <a href="mailto:hei.sleiv@gmail.com">hei.sleiv@gmail.com</a>.</p>

  <h2>Personvern</h2>
  <p>Les <a href="privacy/">personvernerklæringen</a>.</p>
</main>
</body>
</html>
